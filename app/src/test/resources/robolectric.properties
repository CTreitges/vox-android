# Globale Robolectric-Defaults fuer alle JVM-Tests (gilt zusaetzlich zu @Config auf den Testklassen).
#
# sqliteMode=LEGACY: Robolectrics Native-Runtime (SQLite + HWUI) gibt es nur fuer linux-x86_64,
# mac-x86_64/aarch64 und windows-x86_64 — NICHT fuer Linux aarch64 (Dev-VPS). Ab SDK 35 laedt
# Robolectric den Runtime bei sqliteMode=NATIVE (Default) eager beim Test-Setup ->
# "AssertionError: The Robolectric native runtime is not supported on Linux (aarch64)".
# Die App nutzt kein SQLite (nur SharedPreferences), LEGACY ist daher folgenlos.
# GraphicsMode bleibt LEGACY (Default): fuer Compose-Semantik-Tests ausreichend; @GraphicsMode(NATIVE)
# (Bitmaps/Screenshots) wuerde auf aarch64 ebenfalls scheitern.
sqliteMode=LEGACY

# conscryptMode=OFF: Robolectric installiert sonst beim Test-Setup den Conscrypt-OpenSSL-Provider,
# dessen JNI-Lib (conscrypt_openjdk_jni-linux-aarch_64) es fuer Linux aarch64 nicht gibt ->
# UnsatisfiedLinkError. OFF = JVM-Standard-JSSE/BouncyCastle; die JVM-Tests machen keine TLS-Verbindungen.
conscryptMode=OFF
