name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ältere, überholte Läufe desselben Branches abbrechen (spart CI-Minuten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build APK + Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unit-Tests + Lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: Debug-APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: whisperbar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release-Keystore aus Secret schreiben
        env:
          KS_B64: ${{ secrets.WB_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/whisperbar-release.p12"

      - name: Signiertes Release-APK bauen
        env:
          WB_KEYSTORE: ${{ runner.temp }}/whisperbar-release.p12
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: whisperbar
        run: ./gradlew --no-daemon assembleRelease

      - name: Release-APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: whisperbar-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-lint-reports
          path: app/build/reports/
