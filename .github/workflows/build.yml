name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Version für ein GitHub-Release, z. B. v2.0. Leer lassen = nur bauen.
          Das Tag wird dabei auf dem gewählten Branch angelegt.
        required: false
        default: ""

permissions:
  contents: read

# Ältere, überholte Läufe desselben Branches abbrechen (spart CI-Minuten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
  MODEL_PATH: app/src/main/assets/models/ggml-small-q5_1.bin
  TEST_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
  TEST_MODEL_PATH: app/src/androidTest/assets/ggml-tiny-q5_1.bin

jobs:
  build-and-unit:
    name: Build APK + Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: NDK + CMake installieren
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Whisper-Modell cachen
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: whisper-small-q5-v1

      - name: Whisper-Modell laden (falls nicht gecacht)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          curl -L --fail --retry 3 -o "$MODEL_PATH" "$MODEL_URL"
          ls -la "$(dirname "$MODEL_PATH")"

      - name: Unit-Tests + Lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: Debug-APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: whisperbar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release-Keystore aus Secret schreiben
        env:
          KS_B64: ${{ secrets.WB_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/whisperbar-release.p12"

      - name: Signiertes Release-APK bauen
        env:
          WB_KEYSTORE: ${{ runner.temp }}/whisperbar-release.p12
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: whisperbar
        run: ./gradlew --no-daemon assembleRelease

      - name: Release-APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: whisperbar-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-lint-reports
          path: app/build/reports/

  instrumented-tests:
    name: Emulator-Instrumented-Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: NDK + CMake installieren
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Whisper-Modell cachen
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: whisper-small-q5-v1

      - name: Whisper-Modell laden (falls nicht gecacht)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          curl -L --fail --retry 3 -o "$MODEL_PATH" "$MODEL_URL"

      - name: Test-Modell (tiny) cachen
        id: test-model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TEST_MODEL_PATH }}
          key: whisper-tiny-q5-test-v1

      - name: Test-Modell laden (falls nicht gecacht)
        if: steps.test-model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$TEST_MODEL_PATH")"
          curl -L --fail --retry 3 -o "$TEST_MODEL_PATH" "$TEST_MODEL_URL"

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented-Tests auf Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Instrumented-Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/

  release:
    name: GitHub-Release veröffentlichen
    # Zwei Wege: ein Tag-Push (v*) oder ein manueller Start mit gesetztem
    # release_tag. Normale Pushes bauen weiterhin nur Artefakte.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build-and-unit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Signiertes Release-APK aus dem Build-Job holen
        uses: actions/download-artifact@v4
        with:
          name: whisperbar-release-apk
          path: dist

      - name: Version bestimmen und APK benennen
        id: v
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mv dist/app-release.apk "dist/whisperbar-$TAG.apk"
          ls -la dist

      - name: Release anlegen bzw. aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARG=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARG=(--generate-notes)
          fi
          # Idempotent: bei einem erneuten Lauf derselben Version nur die Datei
          # ersetzen, statt am schon vorhandenen Release zu scheitern.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            # --target legt das Tag gleich mit an, auf genau diesem Commit.
            gh release create "$TAG" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "WhisperBar $TAG" \
              "${NOTES_ARG[@]}"
          fi
